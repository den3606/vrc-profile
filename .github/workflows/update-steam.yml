name: Update Steam data

on:
  schedule:
    # 毎週月曜 09:00 JST (00:00 UTC) に実行
    - cron: "0 0 * * 1"
  # Actions タブ → Update Steam data → Run workflow
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-steam
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Fetch Steam data
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: node scripts/fetch-steam.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/steam.json steam.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update steam.json"
            git push
          fi
