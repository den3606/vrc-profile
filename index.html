<!DOCTYPE html>
<!-- data-theme: "vrc" | "minimal" | "terminal" | "soft" -->
<html lang="ja" data-theme="vrc">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <title></title>
  <link rel="icon" href="/images/icon.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="boot-overlay" class="boot-overlay" aria-hidden="true">
    <div class="boot-terminal">
      <div id="boot-line-1" class="boot-line"></div>
      <div id="boot-line-2" class="boot-line"></div>
      <div id="boot-line-3" class="boot-line"></div>
      <span class="boot-cursor">_</span>
    </div>
  </div>

  <div id="return-message" class="return-message" hidden></div>

  <div id="achievement-toast" class="achievement-toast" hidden>
    <div class="toast-label" id="toast-label"></div>
    <div class="toast-body">
      <span id="toast-emoji" class="toast-emoji"></span>
      <span id="toast-title" class="toast-title"></span>
    </div>
  </div>

  <main class="vrc-main" id="main-content" hidden>
    <div class="vrc-profile-card">
      <div class="vrc-banner"></div>
      <div class="vrc-locale-bar">
        <button type="button" class="vrc-locale-cmd" id="locale-hint" hidden>
          <span class="vrc-locale-prompt" aria-hidden="true">&gt;_</span>
          <span class="vrc-locale-text" id="locale-hint-text"></span>
          <span class="vrc-locale-cursor" aria-hidden="true">_</span>
        </button>
      </div>
      <div class="vrc-profile-head">
        <div class="vrc-avatar-wrap">
          <button type="button" class="vrc-avatar-btn" id="avatar-pet-btn" aria-label="Pet avatar">
            <img
              class="vrc-avatar"
              src="images/icon.png"
              alt="Den"
              width="104"
              height="104"
            >
          </button>
        </div>
        <div class="vrc-profile-meta">
          <div class="vrc-name-row">
            <h1 class="profile-name" id="profile-name" data-field="name"></h1>
          </div>
          <p class="profile-tagline vrc-display-name" id="profile-tagline"></p>
          <div class="vrc-actions">
            <a class="vrc-btn vrc-btn-primary" href="https://vrchat.com/home/user/usr_aac1b0fa-a840-4408-bea8-38a010120d03" target="_blank" rel="noopener noreferrer" data-field="vrchat-url"></a>
          </div>
        </div>
      </div>
    </div>

    <nav class="vrc-tabs" aria-label="Profile sections">
      <button type="button" class="vrc-tab vrc-tab-active" data-tab="profile" aria-selected="true"></button>
      <button type="button" class="vrc-tab" data-tab="achievements" aria-selected="false"></button>
    </nav>

    <div id="tab-profile" class="vrc-tab-panel">
      <section class="vrc-card profile-section">
        <h2 class="section-label" id="about-title"></h2>
        <div class="vrc-about-text" id="about-paragraphs"></div>
        <div class="vrc-lang-tags" id="language-tags"></div>
      </section>

      <section class="vrc-card profile-section" data-field="featured">
        <h2 class="section-label" id="steam-featured-title"></h2>
        <ul class="steam-featured" id="steam-featured" hidden></ul>
        <p class="steam-updated" id="steam-featured-updated" hidden></p>
      </section>

      <section class="vrc-card profile-section" data-field="games">
        <h2 class="section-label" id="steam-recent-title"></h2>
        <ul class="steam-games" id="steam-games" aria-live="polite">
          <li class="steam-state"></li>
        </ul>
        <p class="steam-updated" id="steam-updated" hidden></p>
      </section>

      <section class="vrc-card profile-section" data-field="top-games">
        <h2 class="section-label" id="steam-top-title"></h2>
        <ul class="steam-games" id="steam-top-games" aria-live="polite" hidden></ul>
        <p class="steam-updated" id="steam-top-updated" hidden></p>
      </section>

      <div class="profile-spacer" aria-hidden="true"></div>

      <footer class="profile-footer vrc-card vrc-card-flat">
        <button type="button" id="end-reader-btn" class="end-marker end-reader-btn"></button>
      </footer>
    </div>

    <div id="tab-achievements" class="vrc-tab-panel" hidden>
      <section class="vrc-card achievements-panel" id="achievements-panel">
        <div class="achievements-header">
          <h2 class="section-label" id="achievements-header"></h2>
          <p class="achievements-progress"><span id="achievement-count">0</span> / <span id="achievement-total">0</span> <span id="achievement-progress-label"></span></p>
        </div>
        <div class="achievement-grid" id="achievement-list"></div>
      </section>
    </div>
  </main>

  <div id="hidden-profile" class="hidden-profile" hidden>
    <div class="hidden-profile-inner vrc-hidden-inner">
      <div id="hidden-profile-sections"></div>

      <section class="vrc-card profile-section hidden-signal-panel">
        <h2 class="section-label" id="hidden-signal-title"></h2>
        <form id="hidden-signal-form" class="hidden-signal-form" autocomplete="off">
          <label class="hidden-signal-label" id="hidden-signal-name-label" for="hidden-signal-name"></label>
          <input
            type="text"
            id="hidden-signal-name"
            class="hidden-signal-input"
            name="name"
            maxlength="32"
            required
          >

          <label class="hidden-signal-label" id="hidden-signal-message-label" for="hidden-signal-message"></label>
          <textarea
            id="hidden-signal-message"
            class="hidden-signal-textarea"
            name="message"
            maxlength="500"
            rows="4"
            required
          ></textarea>

          <button type="submit" id="hidden-signal-submit" class="hidden-signal-submit vrc-btn vrc-btn-primary"></button>
          <p id="hidden-signal-status" class="hidden-signal-status" hidden></p>
        </form>
      </section>

      <button type="button" id="close-hidden" class="close-hidden-btn vrc-btn vrc-btn-outline"></button>
    </div>
  </div>

  <div id="thank-you-vrc" class="thank-you-vrc" hidden>
    <div class="thank-you-vrc-inner">
      <img
        class="thank-you-vrc-image"
        src="images/thank_you_vrc.png"
        alt="Thank you"
        width="960"
        height="540"
      >
      <button type="button" id="close-thank-you-vrc" class="close-hidden-btn vrc-btn vrc-btn-outline"></button>
    </div>
  </div>

  <button type="button" id="terminal-toggle" class="terminal-toggle">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <rect x="1" y="2" width="14" height="11" rx="1" stroke="currentColor" stroke-width="1" fill="none"/>
      <path d="M3 5 L5 7 L3 9" stroke="currentColor" stroke-width="1.2" fill="none"/>
      <line x1="6" y1="9" x2="11" y2="9" stroke="currentColor" stroke-width="1.2"/>
    </svg>
  </button>

  <div id="access-terminal" class="access-terminal" hidden>
    <div class="access-terminal-header">
      <span id="terminal-header"></span>
      <button type="button" id="terminal-close" class="terminal-close">&times;</button>
    </div>
    <div class="access-terminal-body">
      <label id="terminal-code-label" for="terminal-code-input"></label>
      <div class="terminal-code-row">
        <input
          type="text"
          id="terminal-code-input"
          class="terminal-code-input"
          name="terminal-code"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          data-lpignore="true"
          data-1p-ignore
          data-form-type="other"
          placeholder=""
        >
        <button type="button" id="terminal-code-submit" class="terminal-code-submit"></button>
      </div>
      <div id="terminal-output" class="terminal-output"></div>
    </div>
  </div>
